<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><rect x="24" y="26" width="432" height="248" rx="14" fill="#FFFFFF" stroke="#D9D3C9"/><rect x="24" y="26" width="432" height="30" rx="14" fill="#F2EEE8"/><rect x="24" y="42" width="432" height="14" fill="#F2EEE8"/><text x="40" y="46" fill="#2A2722" font-size="13" font-weight="600"><tspan x="40" dy="0">Rules we keep</tspan></text><text x="440" y="46" fill="#8A8378" font-size="10" text-anchor="end">RULES</text><circle cx="44" cy="76" r="3" fill="#E8683F"/><text x="56" y="80" fill="#2A2722" font-size="12" font-weight="600">Short phrases only</text><text x="56" y="95" fill="#8A8378" font-size="11"><tspan x="56" dy="0">about 8 to 12 words, never a file</tspan></text><circle cx="44" cy="114" r="3" fill="#E8683F"/><text x="56" y="118" fill="#2A2722" font-size="12" font-weight="600">Quotes and Works Cited are left out</text><circle cx="44" cy="138" r="3" fill="#E8683F"/><text x="56" y="142" fill="#2A2722" font-size="12" font-weight="600">A hit is a lead</text><text x="56" y="157" fill="#8A8378" font-size="11"><tspan x="56" dy="0">a person reviews it, never a verdict</tspan></text><circle cx="44" cy="176" r="3" fill="#E8683F"/><text x="56" y="180" fill="#2A2722" font-size="12" font-weight="600">Drive links in the email</text><text x="56" y="195" fill="#8A8378" font-size="11"><tspan x="56" dy="0">shared with her account only</tspan></text></svg>
