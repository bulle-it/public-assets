<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><text x="38" y="40" fill="#8A8378" font-size="12" letter-spacing="2">NEXT STEPS</text><text x="38" y="76" fill="#2A2722" font-size="22" font-weight="700"><tspan x="38" dy="0">Five small steps</tspan></text><circle cx="52" cy="116" r="13" fill="#E8683F"/><text x="52" y="120" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="76" y="120" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Add SearXNG with DuckDuckGo</tspan></text><circle cx="52" cy="150" r="13" fill="#E8683F"/><text x="52" y="154" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="76" y="154" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Test exact phrases on public text</tspan></text><circle cx="52" cy="184" r="13" fill="#E8683F"/><text x="52" y="188" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="76" y="188" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Send a new canary through each route</tspan></text><circle cx="52" cy="218" r="13" fill="#E8683F"/><text x="52" y="222" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="76" y="222" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Check the first canary again in autumn</tspan></text><circle cx="52" cy="252" r="13" fill="#E8683F"/><text x="52" y="256" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">5</text><text x="76" y="256" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Register for the free CORE key</tspan></text></svg>
