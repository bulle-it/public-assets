<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><text x="38" y="40" fill="#8A8378" font-size="12" letter-spacing="2">SAFETY RAILS</text><text x="38" y="76" fill="#2A2722" font-size="22" font-weight="700"><tspan x="38" dy="0">What keeps it from leaking</tspan></text><rect x="36" y="108" width="408" height="32" rx="8" fill="#FFFFFF" stroke="#D9D3C9"/><g transform="translate(48,114) scale(0.72)"><path d="M14 3l10 4v7c0 7-5 10-10 12-5-2-10-5-10-12V7z" fill="none" stroke="#E8683F" stroke-width="2"/><path d="M9 14l4 4 7-8" fill="none" stroke="#E8683F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="129" fill="#2A2722" font-size="11">Every repo private, and gitignore still does the work</text><rect x="36" y="144" width="408" height="32" rx="8" fill="#FFFFFF" stroke="#D9D3C9"/><g transform="translate(48,150) scale(0.72)"><path d="M4 8h7l3 3h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="none" stroke="#E8683F" stroke-width="2"/></g><text x="82" y="165" fill="#2A2722" font-size="11">Confidential goes to the Local folder, never to Outputs</text><rect x="36" y="180" width="408" height="32" rx="8" fill="#FFFFFF" stroke="#D9D3C9"/><g transform="translate(48,186) scale(0.72)"><circle cx="14" cy="14" r="11" fill="none" stroke="#E8683F" stroke-width="2"/><path d="M8 14l4 4 8-9" fill="none" stroke="#E8683F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="201" fill="#2A2722" font-size="11">Outputs denied by default, reopened one extension at a time</text><rect x="36" y="216" width="408" height="32" rx="8" fill="#FFFFFF" stroke="#D9D3C9"/><g transform="translate(48,222) scale(0.72)"><path d="M9 14V8a2 2 0 0 1 4 0v5 M13 13V6a2 2 0 0 1 4 0v7 M17 13V8a2 2 0 0 1 4 0v10a7 7 0 0 1-7 7h-2a7 7 0 0 1-6-4l-3-6a2 2 0 0 1 4-2l1 2" fill="none" stroke="#E8683F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="237" fill="#2A2722" font-size="11">No memory or skill file written before its text is approved</text><rect x="36" y="252" width="408" height="32" rx="8" fill="#FFFFFF" stroke="#D9D3C9"/><g transform="translate(48,258) scale(0.72)"><circle cx="12" cy="12" r="8" fill="none" stroke="#E8683F" stroke-width="2"/><path d="M18 18l7 7" stroke="#E8683F" stroke-width="2" stroke-linecap="round"/></g><text x="82" y="273" fill="#2A2722" font-size="11">Rename anything, then grep the tree for what points at it</text></svg>
