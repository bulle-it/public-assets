<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><text x="38" y="40" fill="#8A8378" font-size="12" letter-spacing="2">THE MECHANISM</text><text x="38" y="76" fill="#2A2722" font-size="22" font-weight="700"><tspan x="38" dy="0">What is inherited, and how</tspan></text><rect x="40.0" y="100" width="125.3" height="140" rx="10" fill="#FFFFFF" stroke="#D9D3C9" stroke-width="1"/><g transform="translate(88.66666666666666,114) scale(0.9)"><circle cx="14" cy="14" r="11" fill="none" stroke="#E8683F" stroke-width="2"/><path d="M8 14l4 4 8-9" fill="none" stroke="#E8683F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="102.66666666666666" y="168" fill="#2A2722" font-size="12.5" font-weight="700" text-anchor="middle"><tspan x="102.66666666666666" dy="0">CLAUDE.md</tspan></text><text x="102.66666666666666" y="186" fill="#E8683F" font-size="10" font-weight="600" text-anchor="middle"><tspan x="102.66666666666666" dy="0">automatic</tspan></text><text x="102.66666666666666" y="208" fill="#8A8378" font-size="9.5" text-anchor="middle"><tspan x="102.66666666666666" dy="0">The harness reads every</tspan><tspan x="102.66666666666666" dy="12">one on its way up the</tspan><tspan x="102.66666666666666" dy="12">tree</tspan></text><rect x="177.3" y="100" width="125.3" height="140" rx="10" fill="#FFFFFF" stroke="#D9D3C9" stroke-width="1"/><g transform="translate(225.99999999999997,114) scale(0.9)"><path d="M6 12a8 8 0 0 1 14-4 M22 16a8 8 0 0 1-14 4" fill="none" stroke="#E8683F" stroke-width="2" stroke-linecap="round"/><path d="M20 4v5h-5 M8 24v-5h5" fill="none" stroke="#E8683F" stroke-width="2" stroke-linecap="round"/></g><text x="239.99999999999997" y="168" fill="#2A2722" font-size="12.5" font-weight="700" text-anchor="middle"><tspan x="239.99999999999997" dy="0">memory/</tspan></text><text x="239.99999999999997" y="186" fill="#E8683F" font-size="10" font-weight="600" text-anchor="middle"><tspan x="239.99999999999997" dy="0">by symlink</tspan></text><text x="239.99999999999997" y="208" fill="#8A8378" font-size="9.5" text-anchor="middle"><tspan x="239.99999999999997" dy="0">The harness path points</tspan><tspan x="239.99999999999997" dy="12">straight into the repo</tspan></text><rect x="314.7" y="100" width="125.3" height="140" rx="10" fill="#FFFFFF" stroke="#E8683F" stroke-width="2"/><g transform="translate(363.3333333333333,114) scale(0.9)"><path d="M9 14V8a2 2 0 0 1 4 0v5 M13 13V6a2 2 0 0 1 4 0v7 M17 13V8a2 2 0 0 1 4 0v10a7 7 0 0 1-7 7h-2a7 7 0 0 1-6-4l-3-6a2 2 0 0 1 4-2l1 2" fill="none" stroke="#E8683F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="377.3333333333333" y="168" fill="#2A2722" font-size="12.5" font-weight="700" text-anchor="middle"><tspan x="377.3333333333333" dy="0">skills</tspan></text><text x="377.3333333333333" y="186" fill="#E8683F" font-size="10" font-weight="600" text-anchor="middle"><tspan x="377.3333333333333" dy="0">nothing at all</tspan></text><text x="377.3333333333333" y="208" fill="#8A8378" font-size="9.5" text-anchor="middle"><tspan x="377.3333333333333" dy="0">One symlink per project</tspan><tspan x="377.3333333333333" dy="12">— a copy drifts silently</tspan></text><text x="240" y="266" fill="#5B554D" font-size="11" text-anchor="middle">Only the first one travels by itself</text></svg>
