<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#3D5A80"/><rect x="26" y="30" width="428" height="240" rx="12" fill="#2A2722"/><path d="M26 42a12 12 0 0 1 12-12h404a12 12 0 0 1 12 12v10H26z" fill="#3A3630"/><circle cx="42" cy="41" r="4" fill="#3D5A80"/><circle cx="56" cy="41" r="4" fill="#5B554D"/><circle cx="70" cy="41" r="4" fill="#5B554D"/><text x="240" y="45" fill="#8A8378" font-size="10" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">~/Projects/Accounting_git</text><text x="44" y="74" fill="#E7E2DA" font-size="12" font-weight="600"><tspan x="44" dy="0">Documents du comptable : lire, signer, archiver, répondre</tspan></text><text x="44" y="100" fill="#3D5A80" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">$ <tspan fill="#E7E2DA">/signature</tspan></text><text x="44" y="120" fill="#B7B0A6" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan x="44" dy="0">› six PDF reçus par mail, chaque signature apposée au bon</tspan><tspan x="44" dy="13">endroit, archivés dans le Drive</tspan></text><text x="44" y="151" fill="#B7B0A6" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan x="44" dy="0">› recherche du mail, tampon de signature appliqué par un script</tspan><tspan x="44" dy="13">local, brouillon de réponse</tspan></text><text x="44" y="182" fill="#B7B0A6" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan x="44" dy="0">› chaque document demande sa signature à un endroit différent,</tspan><tspan x="44" dy="13">vérifié page par page</tspan></text><text x="44" y="213" fill="#B7B0A6" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan x="44" dy="0">› l&#x27;image de signature reste sur le poste ; aucun mail ne part</tspan><tspan x="44" dy="13">sans go</tspan></text><text x="44" y="252" fill="#3D5A80" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">$ <tspan fill="#E7E2DA">▍</tspan></text></svg>
