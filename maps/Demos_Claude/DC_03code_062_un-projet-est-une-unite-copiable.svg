<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#3D5A80"/><rect x="26" y="30" width="428" height="240" rx="12" fill="#2A2722"/><path d="M26 42a12 12 0 0 1 12-12h404a12 12 0 0 1 12 12v10H26z" fill="#3A3630"/><circle cx="42" cy="41" r="4" fill="#3D5A80"/><circle cx="56" cy="41" r="4" fill="#5B554D"/><circle cx="70" cy="41" r="4" fill="#5B554D"/><text x="240" y="45" fill="#8A8378" font-size="10" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">~/Projects/00_Head_AI_Transverse_AI_git</text><text x="44" y="74" fill="#E7E2DA" font-size="12" font-weight="600"><tspan x="44" dy="0">Un projet est une unité copiable</tspan></text><text x="44" y="100" fill="#3D5A80" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">$ <tspan fill="#E7E2DA">ls</tspan></text><text x="44" y="120" fill="#B7B0A6" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan x="44" dy="0">› huit projets, une même structure, règles et mémoire rangées</tspan><tspan x="44" dy="13">dans le dossier du projet</tspan></text><text x="44" y="151" fill="#B7B0A6" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan x="44" dy="0">› ce qui est appris reste dans des fichiers que je copie,</tspan><tspan x="44" dy="13">versionne et partage</tspan></text><text x="44" y="252" fill="#3D5A80" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">$ <tspan fill="#E7E2DA">▍</tspan></text></svg>
