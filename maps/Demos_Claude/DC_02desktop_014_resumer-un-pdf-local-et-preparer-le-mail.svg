<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#2F8F83"/><rect x="28" y="30" width="424" height="240" rx="12" fill="#FFFFFF" stroke="#D9D3C9"/><path d="M28 42a12 12 0 0 1 12-12h400a12 12 0 0 1 12 12v10H28z" fill="#EFECE6"/><circle cx="44" cy="41" r="4" fill="#2F8F83"/><circle cx="58" cy="41" r="4" fill="#D9D3C9"/><circle cx="72" cy="41" r="4" fill="#D9D3C9"/><text x="240" y="45" fill="#8A8378" font-size="10" text-anchor="middle">Claude — Desktop</text><text x="48" y="76" fill="#2A2722" font-size="13" font-weight="600"><tspan x="48" dy="0">Résumer un PDF local et préparer le mail</tspan></text><rect x="48" y="92" width="70" height="18" rx="9" fill="#2F8F83" opacity="0.14"/><text x="83" y="105" fill="#2F8F83" font-size="10" font-weight="600" text-anchor="middle">Mode Chat</text><rect x="44" y="120" width="392" height="40" rx="8" fill="#F2EEE8"/><text x="52" y="134" fill="#5B554D" font-size="11"><tspan x="52" dy="0">je glisse un PDF, Claude le résume puis prépare le mail</tspan><tspan x="52" dy="14">dans ma vraie boîte Gmail</tspan></text><rect x="44" y="168" width="392" height="40" rx="8" fill="#F2EEE8"/><text x="52" y="182" fill="#5B554D" font-size="11"><tspan x="52" dy="0">lecture du fichier local par l&#x27;application et connecteur</tspan><tspan x="52" dy="14">Gmail</tspan></text><rect x="44" y="216" width="392" height="26" rx="8" fill="#F2EEE8"/><text x="52" y="230" fill="#5B554D" font-size="11"><tspan x="52" dy="0">le fichier est sur mon poste et la boîte mail est branchée</tspan></text><text x="48" y="260" fill="#8A8378" font-size="10">Claude Desktop</text></svg>
