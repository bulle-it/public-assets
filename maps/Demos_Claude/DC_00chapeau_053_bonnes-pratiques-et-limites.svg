<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><text x="38" y="40" fill="#8A8378" font-size="12" letter-spacing="2">DÉMOS CLAUDE</text><text x="38" y="66" fill="#2A2722" font-size="22" font-weight="700"><tspan x="38" dy="0">Bonnes pratiques et limites</tspan></text><circle cx="52" cy="110" r="12" fill="#E8683F"/><text x="52" y="114" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="76" y="114" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Donner le contexte : rôle, objectif, format, destinataire ;…</tspan></text><circle cx="52" cy="144" r="12" fill="#E8683F"/><text x="52" y="148" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="76" y="148" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Vérifier les chiffres et les faits importants avant d&#x27;envoy…</tspan></text><circle cx="52" cy="178" r="12" fill="#E8683F"/><text x="52" y="182" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="76" y="182" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Données sensibles : décider ce qu&#x27;on partage, traiter en lo…</tspan></text><circle cx="52" cy="212" r="12" fill="#E8683F"/><text x="52" y="216" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="76" y="216" fill="#2A2722" font-size="12"><tspan x="76" dy="0">En formation : données d&#x27;exemple fictives, vidéos floutées,…</tspan></text></svg>
