<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><text x="38" y="40" fill="#8A8378" font-size="12" letter-spacing="2">YOUR PART</text><text x="38" y="60" fill="#2A2722" font-size="22" font-weight="700"><tspan x="38" dy="0">Three small things</tspan></text><circle cx="52" cy="98" r="13" fill="#E8683F"/><text x="52" y="102" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="76" y="102" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Ask your supervisor for the university&#x27;s thesis layout</tspan><tspan x="76" dy="14">guide</tspan></text><circle cx="52" cy="146" r="13" fill="#E8683F"/><text x="52" y="150" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="76" y="150" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Tell Christophe which sources to compare with your</tspan><tspan x="76" dy="14">chapters</tspan></text><circle cx="52" cy="194" r="13" fill="#E8683F"/><text x="52" y="198" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="76" y="198" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Share texts you wrote yourself in the Calibration</tspan><tspan x="76" dy="14">folder</tspan></text></svg>
