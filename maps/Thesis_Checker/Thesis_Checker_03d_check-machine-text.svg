<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><rect x="24" y="26" width="432" height="248" rx="14" fill="#FFFFFF" stroke="#D9D3C9"/><rect x="24" y="26" width="432" height="30" rx="14" fill="#F2EEE8"/><rect x="24" y="42" width="432" height="14" fill="#F2EEE8"/><text x="40" y="46" fill="#2A2722" font-size="13" font-weight="600"><tspan x="40" dy="0">Machine-written text signal</tspan></text><text x="440" y="46" fill="#8A8378" font-size="10" text-anchor="end">CHECK 4 OF 4</text><circle cx="44" cy="76" r="3" fill="#E8683F"/><text x="56" y="80" fill="#2A2722" font-size="12" font-weight="600">Checks</text><text x="56" y="95" fill="#8A8378" font-size="11"><tspan x="56" dy="0">whether a passage reads more machine-like than your own usual</tspan><tspan x="56" dy="13">style</tspan></text><circle cx="44" cy="127" r="3" fill="#E8683F"/><text x="56" y="131" fill="#2A2722" font-size="12" font-weight="600">Runs as</text><text x="56" y="146" fill="#8A8378" font-size="11"><tspan x="56" dy="0">a free AI model on Christophe&#x27;s computer, calibrated on</tspan><tspan x="56" dy="13">writing samples you share</tspan></text><circle cx="44" cy="178" r="3" fill="#E8683F"/><text x="56" y="182" fill="#2A2722" font-size="12" font-weight="600">Limit</text><text x="56" y="197" fill="#8A8378" font-size="11"><tspan x="56" dy="0">a signal, never proof, needs a good number of your own texts</tspan><tspan x="56" dy="13">to be reliable</tspan></text></svg>
