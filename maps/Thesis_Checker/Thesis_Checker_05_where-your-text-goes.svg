<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><text x="38" y="40" fill="#8A8378" font-size="12" letter-spacing="2">PRIVACY</text><text x="38" y="76" fill="#2A2722" font-size="22" font-weight="700"><tspan x="38" dy="0">Where your text goes</tspan></text><rect x="30" y="104" width="118" height="128" rx="12" fill="#FFFFFF" stroke="#D9D3C9"/><g transform="translate(75,120) scale(1.0)"><path d="M4 8h7l3 3h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="none" stroke="#E8683F" stroke-width="2"/></g><text x="89" y="176" fill="#2A2722" font-size="12" font-weight="700" text-anchor="middle"><tspan x="89" dy="0">Your files</tspan></text><text x="89" y="194" fill="#5B554D" font-size="10" text-anchor="middle"><tspan x="89" dy="0">stay on Drive and on</tspan><tspan x="89" dy="12">one computer</tspan></text><rect x="181" y="104" width="118" height="128" rx="12" fill="#FFFFFF" stroke="#D9D3C9"/><g transform="translate(226,120) scale(1.0)"><rect x="3" y="5" width="15" height="12" rx="2" fill="none" stroke="#E8683F" stroke-width="2"/><rect x="19" y="9" width="7" height="13" rx="2" fill="none" stroke="#E8683F" stroke-width="2"/></g><text x="240" y="176" fill="#2A2722" font-size="12" font-weight="700" text-anchor="middle"><tspan x="240" dy="0">His computer</tspan></text><text x="240" y="194" fill="#5B554D" font-size="10" text-anchor="middle"><tspan x="240" dy="0">does the checks on a</tspan><tspan x="240" dy="12">copy</tspan></text><rect x="332" y="104" width="118" height="128" rx="12" fill="#FFFFFF" stroke="#D9D3C9"/><g transform="translate(377,120) scale(1.0)"><path d="M4 6h20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H12l-6 5v-5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="none" stroke="#E8683F" stroke-width="2"/></g><text x="391" y="176" fill="#2A2722" font-size="12" font-weight="700" text-anchor="middle"><tspan x="391" dy="0">Claude</tspan></text><text x="391" y="194" fill="#5B554D" font-size="10" text-anchor="middle"><tspan x="391" dy="0">sees short flagged</tspan><tspan x="391" dy="12">passages only</tspan></text><path d="M150 168h26" stroke="#E8683F" stroke-width="3" stroke-linecap="round"/><path d="M169 160l8 8-8 8" fill="none" stroke="#E8683F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M301 168h26" stroke="#E8683F" stroke-width="3" stroke-linecap="round"/><path d="M320 160l8 8-8 8" fill="none" stroke="#E8683F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="256" fill="#5B554D" font-size="12" text-anchor="middle">Your file is never uploaded and nothing is published</text><text x="240" y="274" fill="#8A8378" font-size="10.5" text-anchor="middle">A few short phrases may be searched on the web to look for copies</text></svg>
