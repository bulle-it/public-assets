<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><rect x="24" y="26" width="432" height="248" rx="14" fill="#FFFFFF" stroke="#D9D3C9"/><rect x="24" y="26" width="432" height="30" rx="14" fill="#F2EEE8"/><rect x="24" y="42" width="432" height="14" fill="#F2EEE8"/><text x="40" y="46" fill="#2A2722" font-size="13" font-weight="600"><tspan x="40" dy="0">Examples of comments</tspan></text><text x="440" y="46" fill="#8A8378" font-size="10" text-anchor="end">EXAMPLES</text><circle cx="44" cy="76" r="3" fill="#E8683F"/><text x="56" y="80" fill="#2A2722" font-size="12" font-weight="600">Layout</text><text x="56" y="95" fill="#8A8378" font-size="11"><tspan x="56" dy="0">Page 3: the left margin is 1.25 inch, MLA asks for 1 inch</tspan></text><circle cx="44" cy="114" r="3" fill="#E8683F"/><text x="56" y="118" fill="#2A2722" font-size="12" font-weight="600">Language</text><text x="56" y="133" fill="#8A8378" font-size="11"><tspan x="56" dy="0">it&#x27;s should be its, from a real test</tspan></text><circle cx="44" cy="152" r="3" fill="#E8683F"/><text x="56" y="156" fill="#2A2722" font-size="12" font-weight="600">Originality</text><text x="56" y="171" fill="#8A8378" font-size="11"><tspan x="56" dy="0">Chapter 2 paragraph 4 is close to a source you supplied</tspan></text><circle cx="44" cy="190" r="3" fill="#E8683F"/><text x="56" y="194" fill="#2A2722" font-size="12" font-weight="600">Machine text</text><text x="56" y="209" fill="#8A8378" font-size="11"><tspan x="56" dy="0">Paragraph 4 reads closer to machine text than your usual</tspan><tspan x="56" dy="13">style: please check</tspan></text><text x="40" y="266" fill="#8A8378" font-size="10">Only the language line is from a real test; the others use invented numbers.</text></svg>
