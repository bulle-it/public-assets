<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><text x="38" y="40" fill="#8A8378" font-size="12" letter-spacing="2">HOW A RUN GOES</text><text x="38" y="76" fill="#2A2722" font-size="22" font-weight="700"><tspan x="38" dy="0">From your file to your inbox</tspan></text><circle cx="52" cy="116" r="13" fill="#E8683F"/><text x="52" y="120" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="76" y="120" fill="#2A2722" font-size="12"><tspan x="76" dy="0">You drop a Word file on Drive</tspan></text><circle cx="52" cy="150" r="13" fill="#E8683F"/><text x="52" y="154" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="76" y="154" fill="#2A2722" font-size="12"><tspan x="76" dy="0">Christophe starts the checker</tspan></text><circle cx="52" cy="184" r="13" fill="#E8683F"/><text x="52" y="188" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="76" y="188" fill="#2A2722" font-size="12"><tspan x="76" dy="0">The checks run on a copy of your file</tspan></text><circle cx="52" cy="218" r="13" fill="#E8683F"/><text x="52" y="222" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="76" y="222" fill="#2A2722" font-size="12"><tspan x="76" dy="0">A commented copy and a report land on Drive</tspan></text><circle cx="52" cy="252" r="13" fill="#E8683F"/><text x="52" y="256" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">5</text><text x="76" y="256" fill="#2A2722" font-size="12"><tspan x="76" dy="0">You receive two links by email, no attachments</tspan></text></svg>
