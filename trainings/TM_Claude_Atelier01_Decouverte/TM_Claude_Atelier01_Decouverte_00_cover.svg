<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="480" height="300" rx="18" fill="#F7F5F2"/>
  <rect x="0" y="0" width="480" height="8" fill="#E8683F"/>

  <text x="40" y="86" fill="#8A8378" font-size="14" letter-spacing="3">ATELIER #01</text>
  <text x="38" y="140" fill="#2A2722" font-size="48" font-weight="700">Découverte</text>
  <text x="40" y="172" fill="#5B554D" font-size="17">Claude — prise en main en 1 heure</text>

  <!-- 4 component pictos -->
  <g transform="translate(40,210)">
    <!-- web -->
    <rect x="0" y="0" width="92" height="60" rx="10" fill="#FFFFFF" stroke="#D9D3C9"/>
    <rect x="0" y="0" width="92" height="16" rx="10" fill="#E7E2DA"/>
    <circle cx="10" cy="8" r="2.5" fill="#E8683F"/>
    <rect x="14" y="26" width="52" height="6" rx="3" fill="#E7E2DA"/>
    <rect x="14" y="38" width="40" height="6" rx="3" fill="#E7E2DA"/>
    <text x="46" y="80" fill="#8A8378" font-size="11" text-anchor="middle">web</text>

    <!-- desktop -->
    <rect x="112" y="0" width="92" height="60" rx="10" fill="#FFFFFF" stroke="#D9D3C9"/>
    <rect x="124" y="12" width="68" height="36" rx="6" fill="#E7E2DA"/>
    <rect x="150" y="52" width="16" height="4" rx="2" fill="#D9D3C9"/>
    <text x="158" y="80" fill="#8A8378" font-size="11" text-anchor="middle">Desktop</text>

    <!-- cowork -->
    <rect x="224" y="0" width="92" height="60" rx="10" fill="#FFFFFF" stroke="#D9D3C9"/>
    <circle cx="256" cy="30" r="12" fill="#E8683F" opacity="0.18"/>
    <circle cx="284" cy="30" r="12" fill="#E8683F" opacity="0.18"/>
    <path d="M262 30 h16" stroke="#E8683F" stroke-width="3" stroke-linecap="round"/>
    <text x="270" y="80" fill="#8A8378" font-size="11" text-anchor="middle">Cowork</text>

    <!-- code -->
    <rect x="336" y="0" width="92" height="60" rx="10" fill="#2A2722"/>
    <text x="350" y="26" fill="#E8683F" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace">&gt;_</text>
    <rect x="350" y="34" width="46" height="5" rx="2.5" fill="#5B554D"/>
    <rect x="350" y="44" width="30" height="5" rx="2.5" fill="#5B554D"/>
    <text x="382" y="80" fill="#8A8378" font-size="11" text-anchor="middle">Code</text>
  </g>
</svg>
