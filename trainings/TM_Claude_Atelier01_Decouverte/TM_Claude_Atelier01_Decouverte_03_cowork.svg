<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="480" height="300" rx="18" fill="#F7F5F2"/><rect x="0" y="0" width="480" height="8" fill="#E8683F"/><rect x="24" y="26" width="432" height="248" rx="14" fill="#FFFFFF" stroke="#D9D3C9"/><text x="40" y="54" fill="#2A2722" font-size="15" font-weight="700"><tspan x="40" dy="0">Cowork — un mode, pas une app</tspan></text><rect x="40" y="68" width="236" height="30" rx="15" fill="#F2EEE8" stroke="#D9D3C9"/><rect x="160" y="72" width="112" height="22" rx="11" fill="#E8683F"/><text x="100" y="87" fill="#8A8378" font-size="11" font-weight="600" text-anchor="middle">Chat</text><text x="216" y="87" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Cowork</text><text x="40" y="128" fill="#E8683F" font-size="11" font-weight="700">Chat</text><text x="40" y="146" fill="#2A2722" font-size="12"><tspan x="40" dy="0">Tu discutes, tu valides chaque étape.</tspan></text><text x="40" y="202" fill="#E8683F" font-size="11" font-weight="700">Cowork</text><text x="40" y="220" fill="#2A2722" font-size="12"><tspan x="40" dy="0">Tu délègues : Claude planifie et enchaîne seul, sur ton</tspan><tspan x="40" dy="15">poste (Desktop) ou dans le cloud (web / mobile). Offres</tspan><tspan x="40" dy="15">payantes.</tspan></text></svg>
